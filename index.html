<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythmic Inversion Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    #root {
      max-width: 1200px;
      margin: 0 auto;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.9em;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-weight: 600;
      color: #333;
      font-size: 0.9em;
    }

    .control-group input[type="range"] {
      cursor: pointer;
      width: 100%;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      background: #667eea;
      cursor: pointer;
      border-radius: 50%;
      border: none;
    }

    .bpm-value {
      font-size: 1.3em;
      font-weight: bold;
      color: #667eea;
      text-align: center;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9em;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-success {
      background: #48bb78;
      color: white;
    }

    .btn-success:hover {
      background: #38a169;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
    }

    .btn-danger {
      background: #f56565;
      color: white;
    }

    .btn-danger:hover {
      background: #e53e3e;
    }

    .patterns-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .pattern-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pattern-title {
      font-size: 1.2em;
      font-weight: 700;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pattern-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: 600;
    }

    .badge-original {
      background: #667eea;
      color: white;
    }

    .badge-inverted {
      background: #764ba2;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .cell {
      aspect-ratio: 1;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      user-select: none;
      color: #999;
    }

    .cell:hover {
      border-color: #667eea;
      transform: scale(0.95);
    }

    .cell.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .cell.inverted {
      background: #764ba2;
      color: white;
      border-color: #764ba2;
      box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
    }

    .cell.playing-step {
      border-color: #f6ad55;
      box-shadow: 0 0 0 3px rgba(246, 173, 85, 0.7);
      transform: scale(1.05);
    }

    .pattern-text {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 1.1em;
      letter-spacing: 2px;
      text-align: center;
      color: #333;
      user-select: all;
    }

    .playback-controls {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .patterns-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: 500;
    }

    .status.playing {
      background: #c6f6d5;
      color: #22543d;
    }

    .status.idle {
      background: transparent;
      color: transparent;
    }

    .export-section {
      padding-top: 20px;
      border-top: 2px solid #eee;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .export-label {
      font-weight: 600;
      color: #333;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-tpMecw6E.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
